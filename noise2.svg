<svg preserveAspectRatio="none" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <filter id="noiseFilter" color-interpolation-filters="sRGB">
            <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="1" seed="2" />
            <feColorMatrix type="saturate" values="5" />
        </filter>
    </defs>
    <rect width="100%" height="100%" fill="url(#sideAlphaGradient)" filter="url(#noiseFilter)" />
</svg>