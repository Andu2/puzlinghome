<svg preserveAspectRatio="none" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!--
            Single noise source. The rect's fill is a horizontal alpha gradient
            (SourceGraphic: alpha=1 on sides, alpha=0 in center).
            The filter branches the one noise into a color pass and a gray pass,
            masks each with SourceGraphic / inverted-SourceGraphic, then composites.
        -->
        <linearGradient id="sideAlphaGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="white" stop-opacity="1" />
            <stop offset="10%" stop-color="white" stop-opacity="0" />
            <stop offset="90%" stop-color="white" stop-opacity="0" />
            <stop offset="100%" stop-color="white" stop-opacity="1" />
        </linearGradient>
        <filter id="noiseFilter" color-interpolation-filters="sRGB">
            <!-- Single noise source -->
            <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="1" result="noise" />
            <!-- Boosted-saturation + darkened color branch -->
            <!-- SVG spec sat=10 matrix, each row * 0.7 to darken -->
            <feColorMatrix type="matrix" in="noise" result="colorNoise" values="
                    5.658  -4.504  -0.454  0  0
                -1.342   2.496  -0.454  0  0
                -1.342  -4.504   6.546  0  0
                    0       0       0      1  0" />
            <!-- Desaturated + lightened gray branch: sat=0 * 0.6 gain + 0.2 bias -->
            <feColorMatrix type="matrix" in="noise" result="grayNoise" values="
                    0.128  0.429  0.043  0  0.3
                    0.128  0.429  0.043  0  0.3
                    0.128  0.429  0.043  0  0.3
                    0      0      0      1  0" />
            <!-- Invert the alpha of SourceGraphic (side-alpha gradient) for the gray mask -->
            <feComponentTransfer in="SourceGraphic" result="invertedGrad">
                <feFuncA type="linear" slope="-1" intercept="1" />
            </feComponentTransfer>
            <!-- Mask color to sides, gray to center -->
            <feComposite operator="in" in="colorNoise" in2="SourceGraphic" result="maskedColor" />
            <feComposite operator="in" in="grayNoise" in2="invertedGrad" result="maskedGray" />
            <!-- Composite: colored sides over gray center -->
            <feComposite operator="over" in="maskedColor" in2="maskedGray" />
        </filter>
    </defs>
    <rect width="100%" height="100%" fill="url(#sideAlphaGradient)" filter="url(#noiseFilter)" />
</svg>